services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - postgres
      - redis
      - chroma
    volumes:
      # Phase 2 : les tools code_executor / browser_automation lancent des
      # containers Docker "frères" (sandbox jetable) depuis le backend. Le
      # backend a donc besoin du socket Docker de l'hôte (docker-out-of-docker),
      # pas d'un vrai Docker-in-Docker imbriqué.
      - /var/run/docker.sock:/var/run/docker.sock
      # Répertoire SANDBOX_PATH du tool file_reader : dépose tes fichiers ici
      # (./sandbox à la racine du projet) pour qu'il puisse les lire.
      - ./sandbox:/app/sandbox

  worker:
    build: ./backend
    command: celery -A tasks.worker.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
      - chroma
    volumes:
      # Même besoin que le backend : exécute les tools sandboxés (code_executor,
      # browser_automation) via le socket Docker de l'hôte.
      - /var/run/docker.sock:/var/run/docker.sock
      # execute_plan (donc file_reader) tourne réellement ici, dans le worker.
      - ./sandbox:/app/sandbox

volumes:
  postgres_data:
  chroma_data:
