services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - postgres
      - redis
      - chroma
    volumes:
      # Phase 2 : les tools code_executor / browser_automation lancent des
      # containers Docker "frères" (sandbox jetable) depuis le backend. Le
      # backend a donc besoin du socket Docker de l'hôte (docker-out-of-docker),
      # pas d'un vrai Docker-in-Docker imbriqué.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  chroma_data:
