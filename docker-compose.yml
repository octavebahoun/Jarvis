services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # Applique les migrations Alembic une seule fois, avant que backend et
  # worker ne démarrent. Isolé dans son propre service (plutôt que lancé par
  # backend et worker chacun de leur côté) pour éviter que deux containers ne
  # créent la table alembic_version en même temps sur une base neuve — cf.
  # docs/phase2/14-fix-course-migrations-concurrentes.md.
  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jarvis:jarvis@postgres:5432/jarvis
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # Surcharge les valeurs "localhost" de .env (pensées pour un lancement
      # direct sur l'hôte) : depuis l'intérieur d'un container, ces services
      # sont joignables par leur nom de service Docker Compose, pas "localhost".
      DATABASE_URL: postgresql://jarvis:jarvis@postgres:5432/jarvis
      REDIS_URL: redis://redis:6379
      CHROMA_HOST: chroma
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      chroma:
        condition: service_started
    volumes:
      # Phase 2 : les tools code_executor / browser_automation lancent des
      # containers Docker "frères" (sandbox jetable) depuis le backend. Le
      # backend a donc besoin du socket Docker de l'hôte (docker-out-of-docker),
      # pas d'un vrai Docker-in-Docker imbriqué.
      - /var/run/docker.sock:/var/run/docker.sock
      # Répertoire SANDBOX_PATH du tool file_reader : dépose tes fichiers ici
      # (./sandbox à la racine du projet) pour qu'il puisse les lire.
      - ./sandbox:/app/sandbox

  worker:
    build: ./backend
    command: celery -A tasks.worker.celery_app worker --loglevel=info
    env_file: .env
    environment:
      # Même correction que le service backend, cf. commentaire ci-dessus.
      DATABASE_URL: postgresql://jarvis:jarvis@postgres:5432/jarvis
      REDIS_URL: redis://redis:6379
      CHROMA_HOST: chroma
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      chroma:
        condition: service_started
    volumes:
      # Même besoin que le backend : exécute les tools sandboxés (code_executor,
      # browser_automation) via le socket Docker de l'hôte.
      - /var/run/docker.sock:/var/run/docker.sock
      # execute_plan (donc file_reader) tourne réellement ici, dans le worker.
      - ./sandbox:/app/sandbox

volumes:
  postgres_data:
  chroma_data:
